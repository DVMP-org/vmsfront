name: "CI"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
        NEXT_PUBLIC_API_URL: https://vmscore.to
        NEXT_PUBLIC_APP_NAME: VMSCORE
        NEXT_PUBLIC_WS_URL: wss://vmscore.to
        NEXT_VISIT_SUBDOMAIN: visit
        NEXT_PUBLIC_BASE_DOMAIN: vmsfront.to
        NEXT_PUBLIC_ENFORCE_SUBSCRIPTIONS: false
        NEXT_APP_DOMAIN: vmsfront.to
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
        
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VMS_BASE_URL: http://localhost:3106
      VMS_BASE_DOMAIN: localhost
      API_BASE_URL: https://vmscore.to
      E2E_MODE: fixture
      NEXT_PUBLIC_API_URL: https://vmscore.to
      NEXT_PUBLIC_BASE_DOMAIN: localhost
      NEXT_PUBLIC_ENFORCE_SUBSCRIPTIONS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run canonical E2E suite
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright/playwright-report
            playwright/evidence
            playwright/test-results
          if-no-files-found: ignore
          retention-days: 14
    
  build-docker-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        env:
          IMAGE_NAME: vmscore-frontend
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
             ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
             ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
